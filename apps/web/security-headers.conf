# Security headers for the web client's own files (docs/security.md). Included by each static location in
# nginx.conf: an add_header inside a location drops every add_header inherited from the server block, so they
# can't live there. Proxied API responses carry the API's own headers instead.
#
# CSP: the app loads only its own scripts, styles and fonts (self-hosted, no CDN), and talks only to its own origin.
# No inline script or eval anywhere in the bundle; React's style props go through the CSSOM, which CSP allows.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
