<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Boarding Pass · FSSAI Label Check</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#E9ECEF;color:#111418;font:400 15px/1.45 Barlow,sans-serif}
header{background:#111418;color:#fff;padding:16px 40px;font:700 20px "Barlow Condensed"}
.pass{margin:28px 40px;background:#fff;display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;border-radius:10px;overflow:hidden}
.pass div{padding:18px 22px;border-right:2px dashed #CED4DA}.pass div:last-child{border:0}.pass small{display:block;font:600 12px "Barlow Condensed";color:#495057}
.pass b{font:700 24px "Barlow Condensed";font-variant-numeric:tabular-nums}.alert{color:#D9480F}
.board{margin:0 40px;background:#fff;border-radius:10px}.row{display:grid;grid-template-columns:180px 1fr 220px 120px 120px;padding:14px 22px;border-top:1px solid #DEE2E6}
.row.h{font:600 12px "Barlow Condensed";color:#495057;border:0}.row b{font-variant-numeric:tabular-nums}
</style></head><body>
<header>FSSAI Label Check</header>
<div class="pass"><div><small>Product</small><b>Roasted chana</b></div><div><small>Route</small><b class="alert">revise-and-recheck</b></div><div><small>Steps</small><b>7</b></div><div><small>Time</small><b>0.6 s</b></div><div><small>Cost</small><b>$0.0000</b></div></div>
<div class="board"><div class="row h"><span>Run</span><span>Product</span><span>Route</span><span>State</span><span>Time</span></div>
<div class="row"><b>c5152227</b><span>Roasted chana</span><span class="alert">revise-and-recheck</span><span>completed</span><b>0.6 s</b></div>
<div class="row"><b>9e01a7c4</b><span>Masala peanuts</span><span>clear-for-print</span><span>completed</span><b>0.5 s</b></div>
<div class="row"><b>44b2f019</b><span>Protein bar</span><span>regulatory-review</span><span>running</span><b>—</b></div></div>
</body></html>
