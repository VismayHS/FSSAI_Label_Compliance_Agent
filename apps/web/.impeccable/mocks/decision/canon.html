<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Category standard · FSSAI Label Check</title>
<style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#F3F4F6;color:#111827;font:400 15px/1.5 system-ui,sans-serif;display:grid;grid-template-columns:240px 1fr}
aside{background:#fff;border-right:1px solid #E5E7EB;padding:20px}aside b{display:block;margin-bottom:24px;font-size:17px}aside p{padding:8px 12px;border-radius:6px;margin-bottom:4px}aside .on{background:#EFF6FF;color:#2563EB;font-weight:600}
main{padding:28px;display:grid;grid-template-columns:420px 1fr;gap:24px;align-content:start}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:20px}.card h3{font-size:16px;margin-bottom:14px}
.in{border:1px solid #D1D5DB;border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:14px}.btn{background:#2563EB;color:#fff;border-radius:8px;padding:10px;text-align:center;font-weight:600}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}.amber{background:#FEF3C7;color:#92400E}.red{background:#FEE2E2;color:#991B1B}.green{background:#D1FAE5;color:#065F46}
.f{border-top:1px solid #E5E7EB;padding:12px 0}
</style></head><body>
<aside><b>FSSAI Label Check</b><p class="on">New check</p><p>Recent runs</p><p>API docs</p></aside>
<main><div class="card"><h3>Label to check</h3><div class="in">Roasted chana</div><div class="in">Source of protein</div><div class="in">Protein 8 g / 100 g</div><div class="btn">Check label</div></div>
<div class="card"><h3>Result <span class="pill amber">revise-and-recheck</span></h3><p>Unmet or undetermined: CLM-PROTEIN-SOURCE</p>
<div class="f"><span class="pill red">unmet</span> Condition for claim ‘Source of protein’</div><div class="f"><span class="pill green">met</span> Allergen declaration</div></div></main>
</body></html>
