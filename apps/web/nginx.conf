# Serves the built client and proxies the API, so the browser sees one origin (config.js apiBase "").
# Hardening (docs/security.md): no version banner, security headers on every page, a request size cap and a
# per-IP request rate in front of the API's own per-client limits.

# Per-IP rate in front of the API (OWASP API4). Generous for one analyst's browser (polling, lists), tight for a
# script. The API's per-client limit (the gate, D7) still applies behind it.
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;
limit_req_status 429;

server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;
    # Just above the API's own limit (API_MAX_REQUEST_BYTES, 256 KiB), so the API still answers with its JSON 413.
    client_max_body_size 300k;

    # Resolve the api service at request time through Docker's DNS, so nginx starts before the API is up
    # and follows it across restarts and --scale api=N.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location ~ ^/(v1/|healthz$|readyz$|docs|openapi\.json$) {
        limit_req zone=api_per_ip burst=40 nodelay;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location = /web-healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /config.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }
}
