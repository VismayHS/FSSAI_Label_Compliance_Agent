# Serves the built client and proxies the API, so the browser sees one origin (config.js apiBase "").
server {
    listen 8080;
    root /usr/share/nginx/html;

    # Resolve the api service at request time through Docker's DNS, so nginx starts before the API is up
    # and follows it across restarts and --scale api=N.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location ~ ^/(v1/|healthz$|readyz$|docs|openapi\.json$) {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location = /web-healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
