[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fssai-worker"
version = "0.1.0"
description = "Queue consumer: executes label-check runs with the registry's pipeline and saves results"
requires-python = ">=3.11"
dependencies = [
    "fssai-contracts",
    "fssai-observability",
    "rq>=2.12,<3",
    "redis>=8.1,<9",
    "prometheus-client>=0.26,<1",
]

[project.optional-dependencies]
test = ["pytest>=9", "fakeredis>=2.40,<3"]

[tool.setuptools.packages.find]
include = ["fssai_worker*"]
