[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fssai-stub-llm"
version = "0.1.0"
description = "OpenAI-compatible stub LLM: canned replies per prompt tag after a realistic delay (D6, A5 demo)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
test = ["pytest>=9", "httpx2>=2.16,<3"]

[tool.setuptools.packages.find]
include = ["fssai_stub_llm*"]

[tool.setuptools.package-data]
fssai_stub_llm = ["fixtures/*.json"]
