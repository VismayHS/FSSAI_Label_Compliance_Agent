# Hand-maintained provenance for every file in data/corpus/raw (read by data/corpus/tools/manifest.py).
# Owner: Nishkal. One entry per PDF, keyed by file name.
#
# Both files are FSSAI's own consolidated compendia: the principal regulation plus every amendment
# and Direction up to the version date, with substituted provisions printed after the text they
# replace ("Substitution of highlighted provision ... [Operationalized w.e.f. ...]"). FSSAI notes that
# a compendium is not itself a legal document; the Gazette notifications prevail if they differ.
#
# fssai.gov.in reset every connection from our development network on 2026-10-25 (incident
# docs/incidents/2026-10-25-nishkal-fssai-site-unreachable.md), so the bytes were fetched from the
# Internet Archive's capture of the official URL. `source_url` is the official location; `retrieved_via`
# is where these exact bytes came from. Re-download from source_url when reachable and compare sha256.

