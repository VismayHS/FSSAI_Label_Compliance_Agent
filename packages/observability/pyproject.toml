[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fssai-observability"
version = "0.2.0"
description = "JSON logging, OpenTelemetry tracing and Prometheus helpers for every service"
requires-python = ">=3.11"
dependencies = [
    "prometheus-client>=0.20,<1",
    "opentelemetry-api>=1.25,<2",
    "opentelemetry-sdk>=1.25,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.25,<2",
]

[project.optional-dependencies]
test = ["pytest>=9"]

[tool.setuptools.packages.find]
include = ["fssai_observability*"]
