[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fssai-ingest"
version = "0.2.0"
description = "Idempotent CLI index builder: parse, clause-aware chunk, embed locally, FAISS"
requires-python = ">=3.11"
dependencies = [
    "fssai-contracts",
    "fssai-retrieval",
    "pypdf>=5,<7",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
embeddings = ["fssai-retrieval[embeddings]"]
test = ["pytest>=9"]

[tool.setuptools.packages.find]
include = ["fssai_ingest*"]
