[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fssai-gate"
version = "0.1.0"
description = "Ingestion gate: per-client rate limit, validation, quarantine"
requires-python = ">=3.11"
dependencies = [
    "fssai-contracts",
    "redis>=5,<9",                 # shared token bucket across API replicas (D7)
    "psycopg[binary]>=3.2,<4",     # Postgres quarantine (D1)
    "psycopg-pool>=3.2,<4",
    "prometheus-client>=0.20,<1",  # fssai_gate_* counters on the API's /metrics
]

[project.optional-dependencies]
test = ["pytest>=9", "fakeredis[lua]>=2.40,<3", "hypothesis>=6.100,<7"]

[tool.setuptools.packages.find]
include = ["fssai_gate*"]
