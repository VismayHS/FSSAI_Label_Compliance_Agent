# Prometheus scrape config (owner Nishkal, D5). Every service is scraped; scaled services (api, worker)
# are found by DNS: Docker's resolver returns one A record per replica of a compose service, so
# `--scale worker=3` gives three targets with no config change (A7).
global:
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    project: fssai-label-compliance

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # FastAPI service: /metrics on its HTTP port (Vismay, services/api)
  - job_name: api
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 8000
        refresh_interval: 15s

  # RQ workers: prometheus_client server on WORKER_METRICS_PORT (Vismay, services/worker); one target per replica
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
        refresh_interval: 15s

  - job_name: stub-llm
    static_configs:
      - targets: ["stub-llm:8080"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # keep only our compose services' containers, labelled by service name for the dashboard
      - source_labels: [container_label_com_docker_compose_service]
        regex: (.+)
        target_label: service
      - source_labels: [service]
        regex: ""
        action: drop

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: jaeger
    static_configs:
      - targets: ["jaeger:8888"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
