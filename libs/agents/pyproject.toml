[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fssai-agents"
version = "0.1.0"
description = "Classifier and research agents and the LangGraph pipeline"
requires-python = ">=3.11"
# Add each real dependency with bounds as a task needs it, e.g. "faiss-cpu>=1.8,<2".
dependencies = ["fssai-contracts", "langgraph>=0.2,<2"]

[project.optional-dependencies]
test = ["pytest>=9", "fssai-prompts"]

[tool.setuptools.packages.find]
include = ["fssai_agents*"]
