# Loads every dashboard JSON in infra/observability/grafana/dashboards/ (one file per owner, LLM_Context §8.3):
# service-overview (Nishkal), agents (Namith), quality (Vihaan), cost (Vismay).
apiVersion: 1
providers:
  - name: fssai
    folder: FSSAI Label Compliance
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
