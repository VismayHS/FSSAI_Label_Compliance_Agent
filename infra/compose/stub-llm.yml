# Stub LLM (owner Nishkal, D6): OpenAI-compatible stand-in for the provider.
# Load tests and the breaker demo point the gateway at it:  LLM_BASE_URL=http://stub-llm:8080/v1
# Faults at runtime (demo #8), from the host:
#   curl -X POST http://localhost:8081/admin/faults -H "content-type: application/json" -d "{\"down\": \"1\"}"
services:
  stub-llm:
    build:
      context: ../..
      dockerfile: apps/stub_llm/Dockerfile
    image: fssai-stub-llm:local
    env_file:
      - path: ../../.env      # STUB_LATENCY_MEAN_S, STUB_LATENCY_P95_S, STUB_FAIL_RATE, STUB_DOWN, LOG_LEVEL
        required: false
    ports:
      - "${STUB_LLM_HOST_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
