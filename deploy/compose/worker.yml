# Worker (owner Vismay; A4, A5, A7): runs the pipeline for each queued run. No container_name and no host
# port, so `docker compose up --scale worker=3` gives three replicas; Prometheus finds each one by DNS.
services:
  worker:
    build:
      context: ../..
      dockerfile: services/worker/Dockerfile
    image: fssai-worker:local
    env_file:
      - path: ../../.env
        required: false
    environment:
      RUN_DISPATCH: queue
      IMPL_RUN_STORE: fssai_run_store.postgres:PostgresRunStore
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-fssai}:${POSTGRES_PASSWORD:-change-me-locally}@postgres:5432/${POSTGRES_DB:-fssai}
      BREAKER_STORE: redis              # one circuit breaker shared by every replica (A5)
      WORKER_METRICS_PORT: "9100"
      INDEX_DIR: /data/index            # written by the indexer (deploy/compose/indexer.yml)
      HF_HOME: /data/hf-cache
      HF_HUB_OFFLINE: "1"               # embed queries with the model the indexer downloaded, never fetch
    volumes:
      - index-data:/data/index:ro
      - hf-cache:/data/hf-cache:ro
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
      # required: false -> if the index build fails (e.g. EMBEDDING_MODEL unset) the worker still starts and
      # runs on the fake retriever, or degrades honestly with the real one, instead of the stack not booting.
      indexer: {condition: service_completed_successfully, required: false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    restart: unless-stopped
