# API (owner Vismay; A4, F1, F8): accepts runs, enqueues them, serves status, traces and /docs.
# Everything else comes from .env; the values under `environment` are what Compose itself requires.
services:
  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    image: fssai-api:local
    env_file:
      - path: ../../.env
        required: false
    environment:
      RUN_DISPATCH: queue                                       # workers are other containers (decision 302)
      IMPL_RUN_STORE: fssai_run_store.postgres:PostgresRunStore # shared by the API and every worker
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-fssai}:${POSTGRES_PASSWORD:-change-me-locally}@postgres:5432/${POSTGRES_DB:-fssai}
      JAEGER_UI_URL: ${JAEGER_UI_URL:-http://localhost:16686}
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped
